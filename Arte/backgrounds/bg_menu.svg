<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1A0A3A"/>
      <stop offset="35%"  stop-color="#4A1060"/>
      <stop offset="65%"  stop-color="#C24A12"/>
      <stop offset="100%" stop-color="#F0820A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"  stop-color="#FFD050" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF6010" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#FFF8D0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#C8D8FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8090C0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="portalGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#40FFCC" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#0080C0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#003060" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- Sky -->
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- Moon -->
  <circle cx="980" cy="110" r="60" fill="url(#moonGlow)" filter="url(#blur8)"/>
  <circle cx="980" cy="110" r="42" fill="#FFF5C8"/>
  <circle cx="980" cy="110" r="40" fill="#FFF0B0"/>
  <!-- Moon craters -->
  <circle cx="968" cy="102" r="6"  fill="#EED890" opacity="0.5"/>
  <circle cx="993" cy="118" r="4"  fill="#EED890" opacity="0.5"/>
  <circle cx="975" cy="120" r="3"  fill="#EED890" opacity="0.5"/>

  <!-- Stars -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="80"  cy="55"  r="1.5"/>
    <circle cx="190" cy="30"  r="1.0"/>
    <circle cx="310" cy="70"  r="1.8"/>
    <circle cx="440" cy="22"  r="1.2"/>
    <circle cx="560" cy="48"  r="1.5"/>
    <circle cx="700" cy="18"  r="1.0"/>
    <circle cx="820" cy="42"  r="1.8"/>
    <circle cx="1080" cy="38" r="1.2"/>
    <circle cx="1180" cy="60" r="1.5"/>
    <circle cx="1240" cy="25" r="1.0"/>
    <circle cx="130" cy="90"  r="1.0"/>
    <circle cx="260" cy="45"  r="1.2"/>
    <circle cx="390" cy="80"  r="1.0"/>
    <circle cx="650" cy="65"  r="1.5"/>
    <circle cx="760" cy="28"  r="1.2"/>
    <circle cx="1130" cy="78" r="1.0"/>
  </g>

  <!-- Distant mountains silhouette -->
  <path d="M0 320 Q160 200 320 240 Q480 170 640 210 Q800 155 960 200 Q1120 165 1280 220 L1280 400 L0 400 Z" fill="#1A0830" opacity="0.6"/>

  <!-- Pyramid — center, background -->
  <g>
    <!-- Pyramid base glow -->
    <ellipse cx="640" cy="490" rx="280" ry="40" fill="url(#glow)" filter="url(#blur8)"/>
    <!-- Pyramid body -->
    <polygon points="640,160 400,490 880,490" fill="#2A1A50"/>
    <polygon points="640,160 400,490 880,490" fill="none" stroke="#4A2A70" stroke-width="1" opacity="0.5"/>
    <!-- Pyramid steps (lighter lines) -->
    <line x1="580" y1="218" x2="700" y2="218" stroke="#4A3060" stroke-width="1.5" opacity="0.6"/>
    <line x1="540" y1="270" x2="740" y2="270" stroke="#4A3060" stroke-width="1.5" opacity="0.6"/>
    <line x1="500" y1="322" x2="780" y2="322" stroke="#4A3060" stroke-width="1.5" opacity="0.6"/>
    <line x1="460" y1="374" x2="820" y2="374" stroke="#4A3060" stroke-width="1.5" opacity="0.6"/>
    <line x1="420" y1="428" x2="860" y2="428" stroke="#4A3060" stroke-width="1.5" opacity="0.6"/>
    <!-- Temple on top -->
    <rect x="608" y="142" width="64" height="36" fill="#3A2060"/>
    <polygon points="608,142 640,118 672,142" fill="#4A2880"/>
    <!-- Door of temple -->
    <rect x="630" y="158" width="20" height="20" fill="#180830"/>
    <!-- Portal glow at temple door -->
    <ellipse cx="640" cy="165" rx="18" ry="22" fill="url(#portalGlow)" filter="url(#blur4)"/>
  </g>

  <!-- Middle-distance jungle silhouette -->
  <path d="M0 450 Q40 390 80 430 Q120 370 170 420 Q220 360 280 410 Q340 350 400 405 Q450 355 510 400 Q560 345 620 398 Q670 340 730 395 Q790 345 860 405 Q920 355 980 410 Q1040 360 1100 415 Q1160 365 1220 420 Q1260 385 1280 440 L1280 720 L0 720 Z" fill="#0D2818"/>

  <!-- Foreground jungle trees (left) -->
  <g fill="#0A1F12">
    <!-- Tree 1 left -->
    <rect x="30" y="480" width="24" height="240" rx="6"/>
    <circle cx="42" cy="470" r="70" fill="#0D2818"/>
    <circle cx="20" cy="490" r="55" fill="#0D2818"/>
    <circle cx="70" cy="485" r="52" fill="#0D2818"/>
    <!-- Leaves highlight -->
    <circle cx="42" cy="460" r="62" fill="none" stroke="#15401E" stroke-width="3" opacity="0.5"/>
  </g>
  <!-- Tree right group -->
  <g fill="#0A1F12">
    <rect x="1210" y="470" width="24" height="250" rx="6"/>
    <circle cx="1222" cy="458" r="72" fill="#0D2818"/>
    <circle cx="1200" cy="480" r="56" fill="#0D2818"/>
    <circle cx="1252" cy="475" r="54" fill="#0D2818"/>
    <circle cx="1222" cy="448" r="64" fill="none" stroke="#15401E" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- Foreground foliage strip -->
  <path d="M0 620 Q80 570 160 620 Q240 570 320 630 Q400 580 480 635 Q560 580 640 625 Q720 575 800 630 Q880 578 960 628 Q1040 575 1120 622 Q1200 576 1280 618 L1280 720 L0 720 Z" fill="#081810"/>

  <!-- Magical fireflies / particles -->
  <g opacity="0.85">
    <circle cx="200" cy="350" r="3" fill="#80FFD0" filter="url(#blur2)"/>
    <circle cx="350" cy="280" r="2" fill="#80FFD0" filter="url(#blur2)"/>
    <circle cx="900" cy="310" r="3" fill="#80FFD0" filter="url(#blur2)"/>
    <circle cx="1060" cy="260" r="2" fill="#80FFD0" filter="url(#blur2)"/>
    <circle cx="480" cy="420" r="2" fill="#FFE060" filter="url(#blur2)"/>
    <circle cx="820" cy="380" r="3" fill="#FFE060" filter="url(#blur2)"/>
    <circle cx="150" cy="500" r="2" fill="#80FFD0" filter="url(#blur2)"/>
    <circle cx="1100" cy="460" r="2" fill="#80FFD0" filter="url(#blur2)"/>
  </g>

  <!-- Horizon atmospheric glow -->
  <rect x="0" y="370" width="1280" height="80" fill="#FF6010" opacity="0.12" filter="url(#blur8)"/>

  <!-- Title banner area (darkened panel for text readability) -->
  <rect x="180" y="100" width="920" height="180" rx="20" fill="#000000" opacity="0.35"/>
  <rect x="182" y="102" width="916" height="176" rx="19" fill="none" stroke="#FFD050" stroke-width="1.5" opacity="0.4"/>
  <!-- Decorative corner glyphs -->
  <g stroke="#FFD050" stroke-width="2" fill="none" opacity="0.6">
    <path d="M200 118 L200 108 L210 108"/>
    <path d="M1080 118 L1080 108 L1070 108"/>
    <path d="M200 264 L200 274 L210 274"/>
    <path d="M1080 264 L1080 274 L1070 274"/>
  </g>

  <!-- Ground path (white stone, Sak Beh) leading to pyramid -->
  <path d="M560 720 Q580 600 600 490 L680 490 Q700 600 720 720 Z" fill="#C8C0A0" opacity="0.25"/>
</svg>
