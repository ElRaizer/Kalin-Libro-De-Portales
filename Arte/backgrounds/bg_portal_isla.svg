<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#120A38"/>
      <stop offset="40%"  stop-color="#2A1A6A"/>
      <stop offset="75%"  stop-color="#3C4A9A"/>
      <stop offset="100%" stop-color="#5AA0C8"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2A6A48"/>
      <stop offset="100%" stop-color="#123A2C"/>
    </linearGradient>
    <radialGradient id="portalCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="20%"  stop-color="#80FFEE" stop-opacity="0.95"/>
      <stop offset="50%"  stop-color="#0080FF" stop-opacity="0.8"/>
      <stop offset="80%"  stop-color="#4000C0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#200060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="portalHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#60FFDD" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2040C0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#80FFEE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#80FFEE" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur15"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>

  <!-- Cielo del amanecer mágico -->
  <rect width="1280" height="720" fill="url(#sky)"/>
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="90"  cy="50"  r="1.6"/><circle cx="210" cy="90"  r="1.2"/>
    <circle cx="340" cy="34"  r="1.8"/><circle cx="470" cy="80"  r="1.2"/>
    <circle cx="1010" cy="40" r="1.6"/><circle cx="1130" cy="96" r="1.2"/>
    <circle cx="1220" cy="52" r="1.8"/><circle cx="960" cy="110" r="1.2"/>
    <circle cx="150" cy="150" r="1.2"/><circle cx="1180" cy="170" r="1.4"/>
  </g>

  <!-- Mar a lo lejos -->
  <rect x="0" y="380" width="1280" height="70" fill="#4A88B8" opacity="0.55"/>
  <rect x="0" y="384" width="1280" height="6" fill="#DFF6FF" opacity="0.3"/>

  <!-- Halo del portal -->
  <circle cx="800" cy="250" r="330" fill="url(#portalHalo)" filter="url(#blur15)"/>

  <!-- Rayo de luz hacia el suelo -->
  <polygon points="720,330 880,330 980,650 620,650" fill="url(#beam)"/>

  <!-- Portal -->
  <g>
    <circle cx="800" cy="250" r="190" fill="none" stroke="#7060FF" stroke-width="3" opacity="0.5"/>
    <circle cx="800" cy="250" r="170" fill="url(#portalCore)"/>
    <circle cx="800" cy="250" r="150" fill="none" stroke="#B0F4FF" stroke-width="5" opacity="0.75"/>
    <circle cx="800" cy="250" r="118" fill="none" stroke="#80FFEE" stroke-width="3" opacity="0.7" stroke-dasharray="18 12"/>
    <circle cx="800" cy="250" r="82"  fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <circle cx="800" cy="250" r="34" fill="#FFFFFF" opacity="0.95"/>
    <!-- Destellos en el aro -->
    <g fill="#FFF8B0">
      <polygon points="800,86 806,100 794,100"/>
      <polygon points="800,414 806,400 794,400"/>
      <polygon points="636,250 650,244 650,256"/>
      <polygon points="964,250 950,244 950,256"/>
    </g>
    <!-- Rayos internos -->
    <g stroke="#E8FFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
      <polyline points="770,190 792,232 772,236 800,290"/>
      <polyline points="840,200 822,238 846,244 826,296"/>
    </g>
  </g>

  <!-- Isla -->
  <ellipse cx="640" cy="640" rx="720" ry="270" fill="url(#grass)"/>
  <ellipse cx="640" cy="705" rx="320" ry="56" fill="#0A2418" opacity="0.4"/>

  <!-- Sak Beh que lleva al portal -->
  <path d="M560 720 Q640 590 760 540 L836 540 Q760 600 720 720 Z" fill="#F4EBC8" opacity="0.7"/>
  <path d="M760 540 L836 540 L826 520 L770 520 Z" fill="#F4EBC8" opacity="0.5"/>

  <!-- Estela / templete bajo el portal -->
  <g>
    <rect x="730" y="478" width="140" height="60" rx="4" fill="#5A5470"/>
    <rect x="750" y="452" width="100" height="30" rx="4" fill="#6A6480"/>
    <rect x="772" y="430" width="56" height="26" rx="4" fill="#7A7490"/>
    <rect x="740" y="484" width="120" height="6" fill="#80FFEE" opacity="0.5"/>
  </g>

  <!-- Casas -->
  <g>
    <rect x="70" y="440" width="120" height="96" rx="4" fill="#B8A878"/>
    <polygon points="70,440 130,386 190,440" fill="#8E7A50"/>
    <rect x="108" y="482" width="30" height="54" rx="3" fill="#4A3010"/>
    <rect x="150" y="460" width="18" height="18" rx="2" fill="#FFE080" opacity="0.9"/>

    <rect x="1090" y="436" width="126" height="98" rx="4" fill="#B8A878"/>
    <polygon points="1090,436 1153,380 1216,436" fill="#8E7A50"/>
    <rect x="1130" y="480" width="30" height="54" rx="3" fill="#4A3010"/>
  </g>

  <!-- Palmeras -->
  <g>
    <path d="M300 560 Q310 440 300 340" stroke="#2C1E0C" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M300 342 Q240 280 180 308 Q250 322 300 342 Z" fill="#1E6A34"/>
    <path d="M300 342 Q300 260 340 230 Q326 290 300 342 Z" fill="#248A3C"/>
    <path d="M300 342 Q360 282 422 308 Q350 322 300 342 Z" fill="#1E6A34"/>
    <path d="M300 342 Q246 340 210 386 Q264 360 300 342 Z" fill="#1A5E2E"/>
    <path d="M300 342 Q354 342 390 388 Q336 362 300 342 Z" fill="#1A5E2E"/>
  </g>

  <!-- Luciérnagas -->
  <g fill="#B8FFE8" opacity="0.9">
    <circle cx="200" cy="580" r="3"/><circle cx="420" cy="620" r="2.5"/>
    <circle cx="560" cy="560" r="2.5"/><circle cx="1000" cy="600" r="3"/>
    <circle cx="1130" cy="640" r="2.5"/>
  </g>

  <!-- Viñeta -->
  <radialGradient id="vignette" cx="0.55" cy="0.45" r="0.7">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
  </radialGradient>
  <rect width="1280" height="720" fill="url(#vignette)"/>
</svg>
