<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0A1024"/>
      <stop offset="45%"  stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#3E5272"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#243C58"/>
      <stop offset="100%" stop-color="#0E1C30"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1F4A30"/>
      <stop offset="100%" stop-color="#0F2A1C"/>
    </linearGradient>
    <radialGradient id="flash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#F4F8FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9CB8F0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- Cielo de tormenta -->
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- Resplandor del relámpago -->
  <ellipse cx="930" cy="150" rx="330" ry="170" fill="url(#flash)"/>

  <!-- Nubes oscuras -->
  <g fill="#0B1226" opacity="0.9">
    <ellipse cx="180"  cy="70"  rx="260" ry="70"/>
    <ellipse cx="470"  cy="40"  rx="240" ry="62"/>
    <ellipse cx="760"  cy="60"  rx="250" ry="66"/>
    <ellipse cx="1080" cy="40"  rx="270" ry="72"/>
    <ellipse cx="1250" cy="90"  rx="200" ry="60"/>
  </g>
  <g fill="#1A2744" opacity="0.95">
    <ellipse cx="60"   cy="160" rx="210" ry="58"/>
    <ellipse cx="360"  cy="150" rx="230" ry="54"/>
    <ellipse cx="640"  cy="170" rx="210" ry="50"/>
    <ellipse cx="1180" cy="170" rx="200" ry="56"/>
  </g>
  <g fill="#2C3D60" opacity="0.8">
    <ellipse cx="200"  cy="235" rx="180" ry="36"/>
    <ellipse cx="560"  cy="240" rx="200" ry="34"/>
    <ellipse cx="1000" cy="250" rx="190" ry="34"/>
  </g>
  <!-- Bordes iluminados por el relámpago -->
  <g fill="none" stroke="#9CB8F0" stroke-width="3" opacity="0.35">
    <path d="M760 128 Q860 108 960 126"/>
    <path d="M840 160 Q930 146 1030 164"/>
  </g>

  <!-- Relámpago -->
  <g>
    <polygon points="930,120 900,205 930,200 890,300 970,190 938,195 966,120" fill="#F8FCFF" filter="url(#blur4)" opacity="0.8"/>
    <polygon points="930,120 902,205 930,200 892,296 966,192 936,197 962,120" fill="#FFFFFF"/>
  </g>

  <!-- Mar embravecido -->
  <rect x="0" y="360" width="1280" height="130" fill="url(#sea)"/>
  <g fill="none" stroke="#DCE8F8" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M40 385 q30 -16 60 0 t60 0"/>
    <path d="M300 400 q30 -16 60 0 t60 0"/>
    <path d="M620 383 q30 -16 60 0 t60 0"/>
    <path d="M900 402 q30 -16 60 0 t60 0"/>
    <path d="M1120 386 q30 -16 60 0 t60 0"/>
    <path d="M180 440 q34 -18 68 0 t68 0"/>
    <path d="M520 452 q34 -18 68 0 t68 0"/>
    <path d="M820 444 q34 -18 68 0 t68 0"/>
    <path d="M1060 458 q34 -18 68 0 t68 0"/>
  </g>
  <rect x="0" y="362" width="1280" height="6" fill="#B8CCE8" opacity="0.25"/>

  <!-- Isla oscura -->
  <ellipse cx="640" cy="640" rx="720" ry="270" fill="url(#grass)"/>
  <ellipse cx="300" cy="670" rx="240" ry="80" fill="#0B2016" opacity="0.6"/>
  <ellipse cx="990" cy="660" rx="220" ry="70" fill="#0B2016" opacity="0.6"/>

  <!-- Casas en penumbra -->
  <g>
    <rect x="70"  y="440" width="120" height="96" rx="4" fill="#4A4A48"/>
    <polygon points="70,440 130,386 190,440" fill="#30302E"/>
    <rect x="108" y="482" width="30" height="54" rx="3" fill="#1C1408"/>

    <rect x="1090" y="436" width="126" height="98" rx="4" fill="#4A4A48"/>
    <polygon points="1090,436 1153,380 1216,436" fill="#30302E"/>
    <rect x="1130" y="480" width="30" height="54" rx="3" fill="#1C1408"/>
    <!-- Ventana con luz cálida -->
    <rect x="1178" y="462" width="18" height="18" rx="2" fill="#F0B040" opacity="0.8"/>
  </g>

  <!-- Estela en el centro -->
  <rect x="590" y="400" width="100" height="150" rx="5" fill="#68625A" opacity="0.6"/>
  <rect x="610" y="386" width="60" height="28" rx="4" fill="#68625A" opacity="0.6"/>

  <!-- Palmeras dobladas por el viento -->
  <g>
    <path d="M300 560 Q320 440 420 380" stroke="#2C1E0C" stroke-width="14" stroke-linecap="round" fill="none"/>
    <g transform="translate(420 380) scale(1.4) translate(-420 -380)">
    <path d="M420 380 Q500 330 590 350 Q510 372 420 380 Z" fill="#153A1E"/>
    <path d="M420 380 Q520 380 596 430 Q500 410 420 380 Z" fill="#1A4424"/>
    <path d="M420 380 Q470 310 560 290 Q500 340 420 380 Z" fill="#143620"/>
    <path d="M420 380 Q400 320 440 270 Q440 330 420 380 Z" fill="#183F22"/>
    </g>

    <path d="M900 560 Q930 470 1010 430" stroke="#2C1E0C" stroke-width="13" stroke-linecap="round" fill="none"/>
    <g transform="translate(1010 430) scale(1.4) translate(-1010 -430)">
    <path d="M1010 430 Q1090 390 1170 410 Q1100 428 1010 430 Z" fill="#153A1E"/>
    <path d="M1010 430 Q1100 440 1160 490 Q1080 468 1010 430 Z" fill="#1A4424"/>
    <path d="M1010 430 Q1060 366 1140 356 Q1090 396 1010 430 Z" fill="#143620"/>
    </g>
  </g>

  <!-- Hierbas inclinadas en primer plano -->
  <g fill="#0B2A18">
    <path d="M0 720 Q40 640 130 610 Q70 650 50 720 Z"/>
    <path d="M60 720 Q120 660 210 650 Q140 680 120 720 Z"/>
    <path d="M1280 720 Q1240 630 1150 604 Q1210 650 1230 720 Z"/>
    <path d="M1210 720 Q1160 660 1070 650 Q1140 684 1160 720 Z"/>
  </g>

  <!-- Viñeta -->
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
    <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
  </radialGradient>
  <rect width="1280" height="720" fill="url(#vignette)"/>
</svg>
