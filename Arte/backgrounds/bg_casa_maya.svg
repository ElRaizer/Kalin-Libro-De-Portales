<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#EADFBE"/>
      <stop offset="100%" stop-color="#D2C296"/>
    </linearGradient>
    <linearGradient id="thatch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8A6A30"/>
      <stop offset="100%" stop-color="#C9A45A"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#B08C5C"/>
      <stop offset="100%" stop-color="#7C5C36"/>
    </linearGradient>
    <linearGradient id="outside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8CCCF0"/>
      <stop offset="55%"  stop-color="#D0EDF8"/>
      <stop offset="56%"  stop-color="#4CA050"/>
      <stop offset="100%" stop-color="#2E7238"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFF6C0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFF6C0" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- Muro trasero de bajareque -->
  <rect width="1280" height="720" fill="url(#wall)"/>
  <!-- Base de piedra -->
  <rect x="0" y="430" width="1280" height="80" fill="#B8A47A"/>
  <g stroke="#8E7C58" stroke-width="2" opacity="0.6">
    <line x1="0" y1="470" x2="1280" y2="470"/>
    <line x1="120" y1="430" x2="120" y2="470"/><line x1="360" y1="430" x2="360" y2="470"/>
    <line x1="600" y1="430" x2="600" y2="470"/><line x1="840" y1="430" x2="840" y2="470"/>
    <line x1="1080" y1="430" x2="1080" y2="470"/>
    <line x1="240" y1="470" x2="240" y2="510"/><line x1="480" y1="470" x2="480" y2="510"/>
    <line x1="720" y1="470" x2="720" y2="510"/><line x1="960" y1="470" x2="960" y2="510"/>
    <line x1="1200" y1="470" x2="1200" y2="510"/>
  </g>

  <!-- Puerta abierta hacia la aldea -->
  <g>
    <rect x="880" y="190" width="260" height="320" rx="6" fill="url(#outside)"/>
    <!-- palmera y casita a lo lejos -->
    <rect x="1040" y="300" width="8" height="120" fill="#6A4A1A"/>
    <path d="M1044 302 Q1010 270 980 284 Q1016 292 1044 302 Z" fill="#2A8030"/>
    <path d="M1044 302 Q1080 266 1110 282 Q1076 292 1044 302 Z" fill="#2A9038"/>
    <rect x="920" y="378" width="70" height="52" fill="#D0C090"/>
    <polygon points="916,378 955,346 994,378" fill="#B09870"/>
    <!-- marco de madera -->
    <rect x="868" y="180" width="24" height="336" rx="4" fill="#6A4A22"/>
    <rect x="1128" y="180" width="24" height="336" rx="4" fill="#6A4A22"/>
    <rect x="868" y="172" width="284" height="26" rx="4" fill="#5A3C18"/>
  </g>

  <!-- Haz de luz desde la puerta -->
  <polygon points="900,200 1130,200 760,690 430,690" fill="url(#beam)"/>

  <!-- Ventana pequeña -->
  <g>
    <rect x="200" y="240" width="120" height="110" rx="6" fill="#BFE4F5"/>
    <line x1="260" y1="240" x2="260" y2="350" stroke="#6A4A22" stroke-width="6"/>
    <line x1="200" y1="295" x2="320" y2="295" stroke="#6A4A22" stroke-width="6"/>
    <rect x="192" y="232" width="136" height="126" rx="8" fill="none" stroke="#6A4A22" stroke-width="10"/>
  </g>

  <!-- Techo de palma (visto por dentro) -->
  <g>
    <path d="M0 0 H1280 V120 Q640 190 0 120 Z" fill="url(#thatch)"/>
    <g stroke="#6E5224" stroke-width="3" opacity="0.55">
      <line x1="80"   y1="0" x2="110"  y2="128"/>
      <line x1="220"  y1="0" x2="240"  y2="146"/>
      <line x1="370"  y1="0" x2="380"  y2="160"/>
      <line x1="520"  y1="0" x2="524"  y2="172"/>
      <line x1="640"  y1="0" x2="640"  y2="176"/>
      <line x1="760"  y1="0" x2="756"  y2="172"/>
      <line x1="910"  y1="0" x2="900"  y2="160"/>
      <line x1="1060" y1="0" x2="1040" y2="146"/>
      <line x1="1200" y1="0" x2="1170" y2="128"/>
    </g>
    <!-- Vigas -->
    <path d="M0 116 Q640 186 1280 116" stroke="#4A3016" stroke-width="18" fill="none"/>
    <path d="M0 40 Q640 104 1280 40" stroke="#5A3C18" stroke-width="12" fill="none"/>
    <rect x="628" y="0" width="24" height="182" rx="4" fill="#4A3016"/>
  </g>

  <!-- Ganchos vacíos de la hamaca -->
  <g fill="#4A3016">
    <circle cx="90"  cy="330" r="10"/><circle cx="640" cy="330" r="0"/>
    <circle cx="560" cy="300" r="10"/>
  </g>
  <path d="M100 336 Q330 420 552 306" stroke="#C8B078" stroke-width="3" stroke-dasharray="6 8" fill="none" opacity="0.5"/>

  <!-- Suelo de tierra apisonada -->
  <rect x="0" y="510" width="1280" height="210" fill="url(#floor)"/>
  <g stroke="#5E4426" stroke-width="2" opacity="0.4">
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="0" y1="620" x2="1280" y2="620"/>
    <line x1="0" y1="680" x2="1280" y2="680"/>
  </g>

  <!-- Marcas de los muebles que se llevó el huracán -->
  <g fill="none" stroke="#F0DFB0" stroke-width="3" stroke-dasharray="10 8" opacity="0.6">
    <rect x="330" y="580" width="220" height="84" rx="10"/>
    <ellipse cx="740" cy="640" rx="70" ry="24"/>
    <rect x="990" y="600" width="170" height="70" rx="10"/>
  </g>

  <!-- Polvo y hojas que entró con el viento -->
  <g fill="#3E8A3A" opacity="0.85">
    <path d="M720 690 q14 -18 30 -4 q-14 16 -30 4 Z"/>
    <path d="M980 700 q14 -18 30 -4 q-14 16 -30 4 Z"/>
    <path d="M420 706 q14 -18 30 -4 q-14 16 -30 4 Z"/>
    <path d="M1110 580 q14 -16 28 -3 q-14 14 -28 3 Z"/>
  </g>
  <ellipse cx="640" cy="690" rx="500" ry="30" fill="#5E4426" opacity="0.18" filter="url(#blur10)"/>

  <!-- Viñeta -->
  <radialGradient id="vignette" cx="0.5" cy="0.55" r="0.7">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
  </radialGradient>
  <rect width="1280" height="720" fill="url(#vignette)"/>
</svg>
