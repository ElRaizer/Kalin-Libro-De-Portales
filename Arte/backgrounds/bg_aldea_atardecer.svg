<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4E4A8C"/>
      <stop offset="35%"  stop-color="#C8607A"/>
      <stop offset="65%"  stop-color="#F49A55"/>
      <stop offset="100%" stop-color="#FFD37A"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E8A070"/>
      <stop offset="100%" stop-color="#7A5A8C"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4C8A3E"/>
      <stop offset="100%" stop-color="#245A2C"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#FFF2B0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFB050" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <!-- Cielo del atardecer -->
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- Nubes teñidas de rosa -->
  <g fill="#FFC0A0" opacity="0.75">
    <ellipse cx="240"  cy="130" rx="170" ry="20"/>
    <ellipse cx="330"  cy="152" rx="130" ry="14"/>
    <ellipse cx="900"  cy="100" rx="200" ry="22"/>
    <ellipse cx="1020" cy="128" rx="140" ry="14"/>
    <ellipse cx="620"  cy="220" rx="150" ry="14"/>
  </g>
  <g fill="#7A4A8C" opacity="0.35">
    <ellipse cx="160"  cy="70"  rx="200" ry="22"/>
    <ellipse cx="1100" cy="60"  rx="220" ry="24"/>
  </g>

  <!-- Sol poniéndose -->
  <circle cx="640" cy="350" r="190" fill="url(#sunGlow)" filter="url(#blur8)"/>
  <circle cx="640" cy="350" r="74" fill="#FFE888"/>
  <circle cx="640" cy="350" r="66" fill="#FFF3B0"/>

  <!-- Mar dorado -->
  <rect x="0" y="352" width="1280" height="80" fill="url(#sea)"/>
  <rect x="0" y="352" width="1280" height="6" fill="#FFF0C0" opacity="0.5"/>
  <g stroke="#FFE8A0" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="600" y1="368" x2="680" y2="368"/>
    <line x1="580" y1="384" x2="700" y2="384"/>
    <line x1="560" y1="400" x2="720" y2="400"/>
    <line x1="620" y1="416" x2="660" y2="416"/>
  </g>

  <!-- Isla -->
  <ellipse cx="640" cy="640" rx="720" ry="270" fill="url(#grass)"/>
  <ellipse cx="640" cy="600" rx="560" ry="190" fill="#F4A050" opacity="0.14"/>
  <ellipse cx="640" cy="705" rx="320" ry="56" fill="#183A20" opacity="0.4"/>

  <!-- Camino de tierra al centro -->
  <path d="M600 720 Q620 560 630 470 L650 470 Q660 560 700 720 Z" fill="#D9A868" opacity="0.7"/>

  <!-- Casas con ventanas encendidas -->
  <g>
    <rect x="70" y="438" width="120" height="96" rx="4" fill="#C89A6A"/>
    <polygon points="70,438 130,384 190,438" fill="#8E5A34"/>
    <rect x="108" y="480" width="30" height="54" rx="3" fill="#4A2A10"/>
    <rect x="150" y="458" width="18" height="18" rx="2" fill="#FFD866"/>

    <rect x="1090" y="434" width="126" height="98" rx="4" fill="#C89A6A"/>
    <polygon points="1090,434 1153,378 1216,434" fill="#8E5A34"/>
    <rect x="1130" y="478" width="30" height="54" rx="3" fill="#4A2A10"/>
    <rect x="1094" y="456" width="18" height="18" rx="2" fill="#FFD866"/>

    <rect x="330" y="470" width="96" height="76" rx="4" fill="#B98A5E"/>
    <polygon points="330,470 378,426 426,470" fill="#804E2C"/>
    <rect x="360" y="504" width="24" height="42" rx="3" fill="#4A2A10"/>

    <rect x="860" y="466" width="100" height="78" rx="4" fill="#B98A5E"/>
    <polygon points="860,466 910,420 960,466" fill="#804E2C"/>
    <rect x="892" y="502" width="24" height="42" rx="3" fill="#4A2A10"/>
    <rect x="930" y="484" width="14" height="14" rx="2" fill="#FFD866"/>
  </g>
  <!-- Humo de las cocinas -->
  <g fill="#FFE6D0" opacity="0.4" filter="url(#blur4)">
    <ellipse cx="392" cy="405" rx="14" ry="20"/>
    <ellipse cx="402" cy="378" rx="18" ry="22"/>
    <ellipse cx="925" cy="400" rx="14" ry="20"/>
    <ellipse cx="935" cy="374" rx="18" ry="22"/>
  </g>

  <!-- Palmeras en silueta -->
  <g fill="#2A1E1A">
    <path d="M250 560 Q262 440 250 320" stroke="#2A1E1A" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M250 322 Q190 260 130 290 Q200 302 250 322 Z"/>
    <path d="M250 322 Q250 240 290 210 Q276 268 250 322 Z"/>
    <path d="M250 322 Q310 262 372 288 Q300 300 250 322 Z"/>
    <path d="M250 322 Q196 320 160 366 Q214 340 250 322 Z"/>
    <path d="M250 322 Q304 322 340 368 Q286 342 250 322 Z"/>

    <path d="M1010 560 Q1000 440 1012 330" stroke="#2A1E1A" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M1012 332 Q952 270 892 298 Q962 312 1012 332 Z"/>
    <path d="M1012 332 Q1012 250 1052 220 Q1038 278 1012 332 Z"/>
    <path d="M1012 332 Q1072 272 1134 298 Q1062 310 1012 332 Z"/>
    <path d="M1012 332 Q958 330 922 376 Q976 350 1012 332 Z"/>
    <path d="M1012 332 Q1066 332 1102 378 Q1048 352 1012 332 Z"/>
  </g>

  <!-- Luciérnagas -->
  <g fill="#FFF3A0" opacity="0.85">
    <circle cx="300" cy="560" r="3"/><circle cx="470" cy="600" r="2.5"/>
    <circle cx="820" cy="590" r="3"/><circle cx="980" cy="620" r="2.5"/>
    <circle cx="700" cy="660" r="2.5"/>
  </g>

  <!-- Viñeta cálida -->
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
    <stop offset="60%" stop-color="#2A0A20" stop-opacity="0"/>
    <stop offset="100%" stop-color="#2A0A20" stop-opacity="0.4"/>
  </radialGradient>
  <rect width="1280" height="720" fill="url(#vignette)"/>
</svg>
