    <ellipse cx="60" cy="200" rx="70" ry="90" fill="#4E7B52"/>
    <rect x="50" y="260" width="20" height="90" rx="8" fill="#6E5236"/>
    <ellipse cx="1225" cy="180" rx="75" ry="95" fill="#4E7B52"/>
    <rect x="1214" y="250" width="22" height="100" rx="8" fill="#6E5236"/>
  </g>
  <!-- follaje superior decorativo -->
  <g fill="#4E7B52" opacity="0.45">
    <ellipse cx="200" cy="-10" rx="120" ry="60"/>
    <ellipse cx="640" cy="-24" rx="180" ry="66"/>
    <ellipse cx="1080" cy="-10" rx="130" ry="58"/>
  </g>
  <!-- florecitas del suelo -->
  <g opacity="0.5">
    <circle cx="120" cy="640" r="6" fill="#E8C060"/>
    <circle cx="180" cy="690" r="5" fill="#D88098"/>
    <circle cx="1120" cy="655" r="6" fill="#E8C060"/>
    <circle cx="1200" cy="620" r="5" fill="#D88098"/>
    <circle cx="1060" cy="700" r="5" fill="#E8C060"/>
  </g>
</svg>
