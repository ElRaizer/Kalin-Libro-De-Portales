      <stop offset="0" stop-color="#BFD9C4"/>
      <stop offset="1" stop-color="#93B896"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <!-- colinas lejanas -->
  <path d="M0 260 Q200 180 420 250 Q640 320 880 240 Q1100 170 1280 250 L1280 720 L0 720 Z" fill="#7FA383" opacity="0.7"/>
  <path d="M0 360 Q260 280 560 350 Q860 420 1280 330 L1280 720 L0 720 Z" fill="#6E9472" opacity="0.8"/>
  <!-- suelo -->
  <rect y="430" width="1280" height="290" fill="#5F855F" opacity="0.9"/>
  <!-- arboles estilizados laterales (fuera del area del tablero) -->
