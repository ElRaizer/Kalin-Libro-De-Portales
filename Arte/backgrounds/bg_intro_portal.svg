<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="portalCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="20%"  stop-color="#80FFEE" stop-opacity="0.95"/>
      <stop offset="50%"  stop-color="#0080FF" stop-opacity="0.8"/>
      <stop offset="80%"  stop-color="#4000C0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#200060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="roomAmbient" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%"   stop-color="#2060FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#080418" stop-opacity="1"/>
    </radialGradient>
    <filter id="blur5"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="blur15"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- Dark room with blue glow -->
  <rect width="1280" height="720" fill="#060412"/>
  <rect width="1280" height="720" fill="url(#roomAmbient)"/>

  <!-- Stone wall (dark, lit by portal) -->
  <g stroke="#1A0C30" stroke-width="2" opacity="0.6">
    <line x1="0" y1="100" x2="1280" y2="100"/>
    <line x1="0" y1="220" x2="1280" y2="220"/>
    <line x1="0" y1="340" x2="1280" y2="340"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="560" width="1280" height="160" fill="#050310"/>
  <g stroke="#120828" stroke-width="2" opacity="0.5">
    <line x1="0" y1="580" x2="1280" y2="580"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="0" y1="620" x2="1280" y2="620"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
  </g>
  <!-- Floor reflection of portal -->
  <ellipse cx="640" cy="600" rx="300" ry="60" fill="#2060FF" opacity="0.12" filter="url(#blur15)"/>

  <!-- Desk silhouette (dark) -->
  <rect x="280" y="500" width="580" height="20" rx="4" fill="#140A20"/>
  <rect x="300" y="520" width="18" height="200" rx="3" fill="#100818"/>
  <rect x="820" y="520" width="18" height="200" rx="3" fill="#100818"/>
  <!-- Broken/blown-off items from desk -->
  <rect x="200" y="460" width="55" height="18" rx="3" fill="#1A0E28" transform="rotate(-20,227,469)"/>
  <rect x="960" y="480" width="60" height="16" rx="3" fill="#1A0E28" transform="rotate(15,990,488)"/>

  <!-- Portal — center, large, dramatic -->
  <!-- Outer glow rings -->
  <circle cx="640" cy="330" r="280" fill="#0030A0" opacity="0.15" filter="url(#blur30)"/>
  <circle cx="640" cy="330" r="220" fill="#0050D0" opacity="0.25" filter="url(#blur15)"/>
  <!-- Portal swirl (multiple ellipses rotated) -->
  <g transform="translate(640,330)">
    <!-- Outer ring -->
    <ellipse rx="200" ry="200" fill="none" stroke="#4080FF" stroke-width="8" opacity="0.4"/>
    <ellipse rx="190" ry="190" fill="none" stroke="#60A0FF" stroke-width="4" opacity="0.3"/>
    <!-- Swirl arms -->
    <path d="M 0,-180 A 180,180 0 0,1 180,0 A 90,100 0 0,0 0,-80 Z" fill="#40C0FF" opacity="0.35" transform="rotate(0)"/>
    <path d="M 0,-180 A 180,180 0 0,1 180,0 A 90,100 0 0,0 0,-80 Z" fill="#40C0FF" opacity="0.35" transform="rotate(120)"/>
    <path d="M 0,-180 A 180,180 0 0,1 180,0 A 90,100 0 0,0 0,-80 Z" fill="#40C0FF" opacity="0.35" transform="rotate(240)"/>
    <!-- Inner swirl rings -->
    <ellipse rx="130" ry="130" fill="none" stroke="#80D0FF" stroke-width="6" opacity="0.5"/>
    <ellipse rx="80"  ry="80"  fill="none" stroke="#A0E0FF" stroke-width="5" opacity="0.6"/>
    <ellipse rx="40"  ry="40"  fill="none" stroke="#C0F0FF" stroke-width="4" opacity="0.7"/>
    <!-- Core glow -->
    <circle r="160" fill="url(#portalCore)" filter="url(#blur5)"/>
    <circle r="30"  fill="#FFFFFF" opacity="0.9"/>
    <circle r="18"  fill="#E0F8FF"/>
  </g>

  <!-- Gold/teal portal runes around the ring -->
  <g fill="none" stroke="#FFD060" stroke-width="2" opacity="0.7" transform="translate(640,330)">
    <!-- Simple glyph marks around portal -->
    <path d="M -195,-25 L -205,0 L -195,25" />
    <path d="M  195,-25 L  205,0 L  195,25" />
    <path d="M -25,-195 L 0,-205 L 25,-195"/>
    <path d="M -25, 195 L 0, 205 L 25, 195"/>
    <!-- Diagonal marks -->
    <path d="M -138,-138 L -148,-148 L -138,-158"/>
    <path d="M  138,-138 L  148,-148 L  138,-158"/>
    <path d="M -138, 138 L -148, 148 L -138, 158"/>
    <path d="M  138, 138 L  148, 148 L  138, 158"/>
  </g>

  <!-- Flying book pages scattered -->
  <g opacity="0.85">
    <rect x="240" y="160" width="70" height="90" rx="4" fill="#C0DCFF" transform="rotate(-35,275,205)"/>
    <rect x="880" y="140" width="65" height="85" rx="4" fill="#C0DCFF" transform="rotate(28,912,182)"/>
    <rect x="160" y="360" width="55" height="72" rx="4" fill="#D0E8FF" transform="rotate(-20,187,396)"/>
    <rect x="1000" y="250" width="60" height="78" rx="4" fill="#C0DCFF" transform="rotate(40,1030,289)"/>
    <rect x="380" y="100" width="50" height="65" rx="4" fill="#D0ECFF" transform="rotate(-45,405,132)"/>
    <rect x="840" y="420" width="55" height="70" rx="4" fill="#C8E4FF" transform="rotate(22,867,455)"/>
    <rect x="1080" y="180" width="45" height="60" rx="4" fill="#D0E8FF" transform="rotate(-30,1102,210)"/>
    <rect x="130" y="500" width="50" height="65" rx="4" fill="#C8E4FF" transform="rotate(15,155,532)"/>
  </g>
  <!-- Blue glow lines on scattered pages -->
  <g stroke="#60A0FF" stroke-width="1.2" opacity="0.6">
    <line x1="250" y1="175" x2="290" y2="175" transform="rotate(-35,275,205)"/>
    <line x1="250" y1="185" x2="290" y2="185" transform="rotate(-35,275,205)"/>
    <line x1="250" y1="195" x2="285" y2="195" transform="rotate(-35,275,205)"/>
  </g>

  <!-- Bookshelf (dark, lit from portal side) -->
  <rect x="30" y="80" width="180" height="380" rx="4" fill="#0E0820"/>
  <g opacity="0.5">
    <rect x="36" y="95"  width="14" height="60" rx="2" fill="#3A1010"/>
    <rect x="54" y="100" width="12" height="55" rx="2" fill="#103030"/>
    <rect x="70" y="92"  width="16" height="63" rx="2" fill="#0E2A0E"/>
    <rect x="90" y="97"  width="14" height="58" rx="2" fill="#2A1028"/>
    <rect x="108" y="94" width="16" height="61" rx="2" fill="#180E30"/>
    <rect x="128" y="99" width="12" height="56" rx="2" fill="#301010"/>
    <rect x="144" y="93" width="16" height="62" rx="2" fill="#082818"/>
    <rect x="164" y="98" width="12" height="57" rx="2" fill="#280818"/>
  </g>
  <!-- Rim light on bookshelf from portal -->
  <rect x="208" y="80" width="6" height="380" rx="3" fill="#4080FF" opacity="0.25"/>

  <!-- Desk silhouette detail (some lit items) -->
  <rect x="420" y="490" width="80" height="14" rx="3" fill="#1A1030"/>

  <!-- Portal electricity/lightning sparks -->
  <g stroke="#80E0FF" stroke-width="2" opacity="0.8" fill="none">
    <path d="M 640 150 L 620 210 L 650 200 L 625 260"/>
    <path d="M 820 230 L 770 280 L 795 270 L 750 320"/>
    <path d="M 460 230 L 510 280 L 485 270 L 530 320"/>
    <path d="M 640 510 L 660 450 L 630 460 L 655 400"/>
  </g>

  <!-- Ambient room edges darkened -->
  <rect x="0"    y="0"   width="100" height="720" fill="#000000" opacity="0.5"/>
  <rect x="1180" y="0"   width="100" height="720" fill="#000000" opacity="0.5"/>
  <rect x="0"    y="0"   width="1280" height="60" fill="#000000" opacity="0.4"/>
  <rect x="0"    y="660" width="1280" height="60" fill="#000000" opacity="0.5"/>
</svg>
