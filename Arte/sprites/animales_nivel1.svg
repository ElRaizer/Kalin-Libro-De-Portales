    <path d="M38 48 Q32 56 38 64" stroke="#8888A0" stroke-width="2" fill="none"/>
    <path d="M82 48 Q88 56 82 64" stroke="#8888A0" stroke-width="2" fill="none"/>
    <!-- Eyes (large, green) -->
    <ellipse cx="44" cy="44" rx="10" ry="11" fill="white"/>
    <ellipse cx="76" cy="44" rx="10" ry="11" fill="white"/>
    <ellipse cx="44" cy="45" rx="7"  ry="8"  fill="#308030"/>
    <ellipse cx="76" cy="45" rx="7"  ry="8"  fill="#308030"/>
    <ellipse cx="44" cy="45" rx="4"  ry="6"  fill="#0A0A10"/>
    <ellipse cx="76" cy="45" rx="4"  ry="6"  fill="#0A0A10"/>
    <circle cx="42"  cy="42" r="2.5" fill="white"/>
    <circle cx="74" cy="42" r="2.5" fill="white"/>
    <!-- Whiskers -->
    <line x1="24" y1="58" x2="46" y2="60" stroke="#808090" stroke-width="1.5"/>
    <line x1="24" y1="64" x2="46" y2="63" stroke="#808090" stroke-width="1.5"/>
    <line x1="74" y1="60" x2="96" y2="58" stroke="#808090" stroke-width="1.5"/>
    <line x1="74" y1="63" x2="96" y2="64" stroke="#808090" stroke-width="1.5"/>
    <!-- Nose -->
    <polygon points="60,56 56,62 64,62" fill="#E880A0"/>
    <!-- Mouth -->
    <path d="M56 62 Q60 68 64 62" stroke="#C05070" stroke-width="1.5" fill="none"/>
