    <ellipse cx="60" cy="68" rx="8" ry="6" fill="#FF7080"/>
    <!-- Collar -->
    <rect x="34" y="66" width="52" height="8" rx="4" fill="#E05020"/>
    <circle cx="60" cy="70" r="4" fill="#FFD040"/>
    <!-- Maya name tag on collar -->
    <rect x="50" y="66" width="20" height="8" rx="3" fill="#FFD040"/>
