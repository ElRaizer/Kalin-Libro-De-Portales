    <rect x="36" y="66" width="48" height="8" rx="4" fill="#0D8A7A"/>
    <circle cx="60" cy="70" r="4" fill="#FFD040"/>
  </g>

  <!-- KÁAX (Gallina) — col 240-359 -->
  <g transform="translate(240,0)">
