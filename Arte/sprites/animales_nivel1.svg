    <circle cx="58" cy="47" r="2" fill="white" opacity="0.6"/>
    <!-- Eyes -->
    <ellipse cx="44" cy="40" rx="9" ry="9" fill="white"/>
    <ellipse cx="76" cy="40" rx="9" ry="9" fill="white"/>
    <ellipse cx="45" cy="41" rx="6" ry="6" fill="#3A2010"/>
    <ellipse cx="77" cy="41" rx="6" ry="6" fill="#3A2010"/>
    <circle cx="43"  cy="38" r="2.5" fill="white"/>
    <circle cx="75" cy="38" r="2.5" fill="white"/>
    <!-- Happy eyebrows -->
    <path d="M37 32 Q44 27 52 31" stroke="#8B5020" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M68 31 Q75 27 84 32" stroke="#8B5020" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Happy mouth -->
    <path d="M48 62 Q60 70 72 62" stroke="#8B3810" stroke-width="2" fill="none" stroke-linecap="round"/>
