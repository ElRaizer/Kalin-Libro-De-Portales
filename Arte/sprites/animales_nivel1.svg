    <!-- Beak -->
    <polygon points="60,48 46,54 60,58" fill="#E4A020"/>
    <!-- Eye -->
    <ellipse cx="72" cy="40" rx="9" ry="9" fill="white"/>
    <ellipse cx="73" cy="41" rx="6" ry="6" fill="#C84010"/>
    <circle cx="74" cy="40" rx="3" ry="3" fill="#1A0808"/>
    <circle cx="73" cy="39" r="2" fill="white"/>
    <!-- Eyebrow-feather crest -->
    <path d="M66 33 Q72 28 80 33" stroke="#A83010" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Happy expression marks -->
    <path d="M32 72 Q38 68 44 72" stroke="#E87838" stroke-width="1.5" fill="none" opacity="0.6"/>
