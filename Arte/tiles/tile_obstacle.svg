<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="leafGrad" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%"  stop-color="#4AB050"/>
      <stop offset="100%" stop-color="#1A6020"/>
    </radialGradient>
    <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#6A4018"/>
      <stop offset="60%" stop-color="#8A5820"/>
      <stop offset="100%" stop-color="#5A3410"/>
    </linearGradient>
  </defs>
  <!-- Ground patch -->
  <ellipse cx="40" cy="74" rx="28" ry="8" fill="#3A7830" opacity="0.5"/>
  <!-- Tree trunk -->
  <path d="M34 72 Q32 55 36 44 Q40 38 44 44 Q48 55 46 72 Z" fill="url(#trunkGrad)"/>
  <!-- Trunk texture lines -->
  <path d="M36 68 Q38 55 38 46" stroke="#5A3410" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M44 68 Q42 55 42 46" stroke="#9A6820" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Root curves -->
  <path d="M34 72 Q26 76 20 72" stroke="#5A3410" stroke-width="2.5" fill="none"/>
  <path d="M46 72 Q54 76 60 72" stroke="#5A3410" stroke-width="2.5" fill="none"/>
  <!-- Back leaves -->
  <ellipse cx="40" cy="30" rx="26" ry="20" fill="#1A7020" opacity="0.7"/>
  <!-- Main canopy -->
  <ellipse cx="40" cy="26" rx="30" ry="24" fill="url(#leafGrad)"/>
  <ellipse cx="28" cy="32" rx="20" ry="16" fill="url(#leafGrad)" opacity="0.9"/>
  <ellipse cx="52" cy="32" rx="18" ry="14" fill="url(#leafGrad)" opacity="0.9"/>
  <!-- Top cluster -->
  <ellipse cx="40" cy="14" rx="16" ry="14" fill="#50C058"/>
  <!-- Leaf highlights -->
  <path d="M32 18 Q40 12 48 18" stroke="#70D870" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M26 28 Q34 22 40 28" stroke="#60C060" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Small flowers (tropical detail) -->
  <circle cx="52" cy="20" r="4" fill="#FF5040" opacity="0.8"/>
  <circle cx="26" cy="26" r="3" fill="#FFD030" opacity="0.8"/>
</svg>
